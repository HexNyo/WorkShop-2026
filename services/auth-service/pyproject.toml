[project]
name = "auth-service"
version = "1.0.0"
description = "PROJECT RESILIENCE-ALPHA — authentification, RBAC et cycle de vie des jetons"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 120
target-version = "py312"
