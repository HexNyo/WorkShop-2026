[build-system]
requires = ["setuptools>=75.6", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "ra-common"
version = "1.0.0"
description = "PROJECT RESILIENCE-ALPHA — socle transverse des services Python (logs, erreurs, santé, métriques, sécurité JWT)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "pydantic>=2.9,<3",
    "PyJWT[crypto]>=2.10.1,<3",
    "httpx>=0.27,<0.29",
    "prometheus-client>=0.21,<0.22",
]

[project.optional-dependencies]
mariadb = ["aiomysql>=0.2,<0.3", "PyMySQL>=1.1.1,<2"]

[tool.setuptools.packages.find]
include = ["ra_common*"]
